name: iOS IPA Build

on:
  workflow_dispatch:
  push:
    branches:
      - deploy
    paths:
      - 'ArtifyFronted/**'
      - '.github/workflows/ios-build.yml'

jobs:
  build-ios:
    name: Build unsigned iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get
        working-directory: ArtifyFronted

      - name: Install CocoaPods dependencies
        run: pod install --repo-update
        working-directory: ArtifyFronted/ios

      - name: Build iOS app without code signing
        run: flutter build ios --release --no-codesign
        working-directory: ArtifyFronted

      - name: Package unsigned IPA
        shell: bash
        run: |
          rm -rf Payload FlutterIpaExport.ipa
          mkdir Payload
          mv Runner.app Payload/
          zip -qq -r -9 FlutterIpaExport.ipa Payload
        working-directory: ArtifyFronted/build/ios/iphoneos

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: artify-ios-unsigned-ipa
          path: ArtifyFronted/build/ios/iphoneos/FlutterIpaExport.ipa
