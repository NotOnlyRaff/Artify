org.gradle.jvmargs=-Xmx4G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.vfs.watch=false
org.gradle.caching=false

# Forza la compatibilità con i plugin più vecchi
android.nonTransitiveRClass=false
android.defaults.buildfeatures.buildconfig=true

# Come suggerito dal box "Flutter Fix" per evitare conflitti con AGP 9
android.newDsl=false

# Altri fix per NullPointerException comuni su Windows
android.experimental.privacysandbox.sdk.enable=false
