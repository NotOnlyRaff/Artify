workflows:
  ios-release-workflow:
    name: iOS Build
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Install dependencies
        script: flutter packages pub get
      - name: Build IPA
        # Usiamo --no-codesign se non hai ancora caricato i certificati su Codemagic
        script: flutter build ipa --release --no-codesign
    artifacts:
      - build/ios/ipa/*.ipa
