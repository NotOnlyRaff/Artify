services:

  backend:
    build:
      context: ./ArtifyBackend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:Password123@db:5432/Artify
    depends_on:
      - db

  db:
    image: postgres:16
    container_name: artify-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Password123
      POSTGRES_DB: Artify
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: artify-pgadmin
    restart: always
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@artify.com
      PGADMIN_DEFAULT_PASSWORD: admin
    depends_on:
      - db

volumes:
  postgres_data: